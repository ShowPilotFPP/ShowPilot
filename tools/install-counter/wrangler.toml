# ShowPilot install counter — Cloudflare Worker + D1
# See README.md for the 5-minute setup.
name = "showpilot-install-counter"
main = "src/index.js"
compatibility_date = "2025-06-01"

# The map library (jsvectormap, MIT) is served from the Worker itself.
# Its files are kept as .txt so they are bundled as plain text.
[[rules]]
type = "Text"
globs = ["**/*.txt"]

# Daily job: saves the day's totals for the trend chart and deletes
# installs that haven't checked in for over a year.
[triggers]
crons = ["17 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "showpilot-installs"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Optional: set a STATS_KEY secret (`npx wrangler secret put STATS_KEY`)
# to make the stats page private (open it as /?key=YOUR_KEY).
