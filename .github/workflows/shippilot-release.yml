# Ship this repo through ShipPilot (ShipPilot v0.4.0+). Run it from the Actions
# tab on the branch you want to ship (e.g. a pull request's branch), after
# bumping the version there. ShipPilot runs its normal pipeline: preflight
# checks, commit to the target branch, tag, GitHub Release, auto-deploy; this
# job then waits for the deploys and fails if any fails.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SHIPPILOT_URL    the address ShipPilot opens at in a browser, e.g. https://example.com/push
#   SHIPPILOT_TOKEN  a ShipPilot API token limited to showpilot and showpilot-beta

name: Ship via ShipPilot

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to ship"
        type: choice
        options: [main, beta]
        default: main
      commit_message:
        description: "Release message (first line becomes the GitHub Release title)"
        required: true

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the target and version
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" = "beta" ]; then
            REPO_SLUG=showpilot-beta; TARGET_BRANCH=beta; WITH_TAG=false
          else
            REPO_SLUG=showpilot; TARGET_BRANCH=main; WITH_TAG=true
          fi
          VERSION=$(node -p "require('./package.json').version")
          case "$TARGET_BRANCH:$VERSION" in
            main:*-*) echo "::error::$VERSION is a beta-style version; ship it to beta, or bump to a stable version for main."; exit 1 ;;
            beta:*-beta.*) ;;
            beta:*) echo "::error::Beta releases need a version like 1.2.3-beta.1 (got $VERSION)."; exit 1 ;;
          esac
          if [ "${GITHUB_REF_NAME}" = "$TARGET_BRANCH" ]; then
            echo "::error::Run this on the branch you want to ship (e.g. a PR branch), not $TARGET_BRANCH."
            exit 1
          fi
          echo "REPO_SLUG=$REPO_SLUG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "WITH_TAG=$WITH_TAG" >> "$GITHUB_ENV"
          echo "Shipping $REPO_SLUG $VERSION from ${GITHUB_REF_NAME} to $TARGET_BRANCH"

      - name: Build the release tarball
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          mkdir -p out
          # git archive = tracked files only: no .git, node_modules, config.js or data/.
          git archive --format=tar --prefix="${REPO_SLUG}/" HEAD | tar -x -C out
          python3 - <<PY
          import json, os
          m = {"repo": "${REPO_SLUG}", "version": "${VERSION}", "commit_message": os.environ["COMMIT_MESSAGE"]}
          if "${WITH_TAG}" == "true":
              m["tag"] = "v${VERSION}"
          json.dump(m, open("out/${REPO_SLUG}/.release.json", "w"), indent=2)
          PY
          tar -czf release.tar.gz -C out "${REPO_SLUG}"
          echo "Packaged ${REPO_SLUG} ${VERSION} (tag: ${WITH_TAG})"

      - name: Upload to ShipPilot and wait for deploys
        env:
          SHIPPILOT_URL: ${{ secrets.SHIPPILOT_URL }}
          SHIPPILOT_TOKEN: ${{ secrets.SHIPPILOT_TOKEN }}
        run: |
          set -uo pipefail
          URL="${SHIPPILOT_URL%/}"
          HTTP=$(curl -sS -o result.json -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer ${SHIPPILOT_TOKEN}" \
            -F "tarball=@release.tar.gz" "${URL}/api/release")
          python3 -c "import json; d=json.load(open('result.json')); print(d.get('log') or d)" || cat result.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::ShipPilot refused the release (HTTP $HTTP): $(python3 -c "import json; print(json.load(open('result.json')).get('error'))" 2>/dev/null)"
            exit 1
          fi
          RID=$(python3 -c "import json; print(json.load(open('result.json'))['releaseId'])")
          DEPLOYS=$(python3 -c "import json; d=json.load(open('result.json'))['deploys']; print('pending' if d == 'pending' else 'none')")
          echo "Shipped as ShipPilot release #${RID}."
          if [ "$DEPLOYS" = "none" ]; then echo "No auto-deploy environments for this repo."; exit 0; fi
          echo "Waiting for auto-deploys (up to 15 minutes)..."
          for i in $(seq 1 90); do
            sleep 10
            curl -sS --max-time 30 -H "Authorization: Bearer ${SHIPPILOT_TOKEN}" "${URL}/api/releases/${RID}/deploys" -o deploys.json || continue
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('deploys.json')).get('allSettled') else 1)"; then
              python3 - <<'PY'
          import json, sys
          d = json.load(open('deploys.json'))['deploys']
          bad = [x for x in d if x['status'] != 'success']
          for x in d:
              print(f"  {x.get('env_name') or x.get('env_slug')}: {x['status']}" + (f" - {x['error_message']}" if x.get('error_message') else ''))
          if bad:
              print("::error::" + ", ".join(f"{x.get('env_name') or x.get('env_slug')} deploy {x['status']}" for x in bad))
              sys.exit(1)
          print("All deploys succeeded.")
          PY
              exit $?
            fi
          done
          echo "::warning::Deploys still running after 15 minutes; check ShipPilot."
